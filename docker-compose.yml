name: citywall
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-citywall_root_dev}
      MYSQL_DATABASE: city_wall
      MYSQL_USER: city_wall
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-city_wall_dev}
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD"']
      interval: 5s
      timeout: 5s
      retries: 30
  server:
    build: ./server
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      CITY_WALL_CONFIG: /app/conf/server.json
      CITY_WALL_DB_DSN: city_wall:${MYSQL_PASSWORD:-city_wall_dev}@tcp(mysql:3306)/city_wall?charset=utf8mb4&parseTime=True&loc=UTC
      CITY_WALL_RECOGNIZER_URL: http://recognizer:8000
      CITY_WALL_RECOGNIZER_TOKEN: ${RECOGNIZER_TOKEN:-citywall_internal_dev}
      CITY_WALL_JWT_SECRET: ${JWT_SECRET:-citywall_jwt_local_demo_change_before_deploy}
      CITY_WALL_WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      CITY_WALL_WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - server-data:/app/data/storage
      - ./conf:/app/conf:ro
    command: [sh, -c, '/app/bin/migrate -config /app/conf/server.json -dir /app/migrations && /app/bin/seed -config /app/conf/server.json && exec /app/bin/citywall-server']
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/readyz]
      interval: 5s
      timeout: 3s
      retries: 30
  recognizer:
    build: ./recognizer
    environment:
      RECOGNIZER_CONFIG: /app/conf/recognizer.json
      RECOGNIZER_TOKEN: ${RECOGNIZER_TOKEN:-citywall_internal_dev}
      RECOGNIZER_WEIGHTS: /app/data/yolo/weights/best.pt
      VLM_BASE_URL: ${VLM_BASE_URL:-}
      VLM_MODEL: ${VLM_MODEL:-}
      VLM_API_KEY: ${VLM_API_KEY:-}
    volumes:
      - ./conf:/app/conf:ro
      - ./data/yolo:/app/data/yolo:ro
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/internal/v1/healthz")']
      interval: 10s
      timeout: 3s
      retries: 20
  web:
    build: ./web
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:80"
volumes:
  mysql-data:
  server-data:
