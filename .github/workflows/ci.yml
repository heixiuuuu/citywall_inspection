name: CI

# 三端验证：服务端（Go）、识别服务（Python）、PC 管理端（Node）。
# 推送任何分支与 PR 时运行；MySQL 集成测试在 MySQL 服务容器就绪后启用。

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  server:
    name: Server (Go)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: city_wall
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -proot"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - name: Chinese report font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-arphic-gbsn00lp
          echo "CITY_WALL_TEST_FONT=$(find /usr/share/fonts -name gbsn00lp.ttf -print -quit)" >> "$GITHUB_ENV"
      - name: Vet
        working-directory: server
        run: go vet ./...
      - name: Build
        working-directory: server
        run: go build ./...
      - name: Test
        working-directory: server
        env:
          GOPROXY: https://goproxy.cn,direct
        run: go test ./...
      - name: Prepare test database
        run: docker exec "${{ job.services.mysql.id }}" mysql -uroot -proot -e "CREATE DATABASE IF NOT EXISTS city_wall_test CHARACTER SET utf8mb4;"
      - name: Integration tests (GORM + MySQL)
        working-directory: server
        env:
          GOPROXY: https://goproxy.cn,direct
          CITY_WALL_TEST_DSN: "root:root@tcp(127.0.0.1:3306)/city_wall_test?charset=utf8mb4&parseTime=True&loc=UTC&multiStatements=true"
        run: go test -tags integration ./internal/module/task/ ./internal/module/observation/

  recognizer:
    name: Recognizer (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install deps
        working-directory: recognizer
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Contract tests
        working-directory: recognizer
        run: python -m pytest tests/ -q

  web:
    name: PC Admin (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install deps
        working-directory: web
        run: npm ci
      - name: Build
        working-directory: web
        run: npm run build

  miniapp:
    name: Inspector resources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: miniapp/package-lock.json
      - run: npm ci
        working-directory: miniapp
      - run: npm run build:h5 && npm run build:mp-weixin && npm run build:app
        working-directory: miniapp
