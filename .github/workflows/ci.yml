name: CI

# 三端验证：服务端（Go）、识别服务（Python）、PC 管理端（Node）。
# 推送任何分支与 PR 时运行；MySQL 集成测试在 MySQL 服务容器就绪后启用。

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  server:
    name: Server (Go)
    runs-on: ubuntu-latest
    # 集成测试（GORM + 真实 MySQL）就绪后启用 service 容器：
    # services:
    #   mysql:
    #     image: mysql:8.0
    #     env:
    #       MYSQL_ROOT_PASSWORD: root
    #       MYSQL_DATABASE: city_wall
    #     ports: ["3306:3306"]
    #     options: >-
    #       --health-cmd "mysqladmin ping -h localhost -proot"
    #       --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - name: Vet
        working-directory: server
        run: go vet ./...
      - name: Build
        working-directory: server
        run: go build ./...
      - name: Test
        working-directory: server
        env:
          GOPROXY: https://goproxy.cn,direct
        run: go test ./...

  recognizer:
    name: Recognizer (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
      - name: Install deps
        working-directory: recognizer
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Contract tests
        working-directory: recognizer
        run: python -m pytest tests/ -q

  web:
    name: PC Admin (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install deps
        working-directory: web
        run: npm ci
      - name: Type check
        working-directory: web
        run: npx vue-tsc --noEmit
      - name: Build
        working-directory: web
        run: npm run build
