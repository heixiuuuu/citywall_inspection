openapi: 3.0.3
info:
  title: 古城墙病害巡检系统 · 对外 API
  description: |
    Go 业务服务公开接口契约（/api/v1）。
    约定：成功响应 {"data": ..., "request_id": ...}；
    失败响应 {"error": {"code": ..., "message": ..., "details": ...}, "request_id": ...}。
    本文件与代码共同维护；初始化阶段仅覆盖首条纵向链路，随模块开发增量补充。
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: 存活检查
      responses:
        '200':
          description: ok
  /readyz:
    get:
      summary: 就绪检查（依赖 MySQL）
      responses:
        '200':
          description: ready
        '503':
          description: not ready
  /api/v1/tasks:
    post:
      summary: 创建任务草稿（管理员）
      operationId: createTask
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, assignee_id, point_ids]
              properties:
                title: { type: string, example: '东城墙 2 号段巡检' }
                assignee_id: { type: integer, example: 1001 }
                due_at: { type: string, format: date-time, example: '2026-10-15T00:00:00Z' }
                description: { type: string }
                point_ids: { type: array, items: { type: integer }, example: [3001, 3002] }
      responses:
        '201':
          description: 草稿创建成功
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/observations:
    post:
      summary: 创建现场记录草稿（小程序）
      operationId: createObservation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, location_text]
              properties:
                source:
                  type: string
                  enum: [TASK, VOLUNTARY]
                  example: TASK
                task_point_id: { type: integer, nullable: true, description: 'source=TASK 时必填' }
                location_text: { type: string }
      responses:
        '201':
          description: 草稿创建成功
        '400':
          $ref: '#/components/responses/BadRequest'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: 参数校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Unauthorized:
      description: 未认证
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
  schemas:
    ErrorBody:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string }
            details: { type: object }
        request_id: { type: string, example: req_abc123 }
