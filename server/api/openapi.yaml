openapi: 3.1.0
info:
  title: 古城墙病害巡检系统 · 对外 API
  description: |
    Go 业务服务公开接口契约（/api/v1）。
    约定：成功响应 {"data": ..., "request_id": ...}；
    失败响应 {"error": {"code": ..., "message": ...}, "request_id": ...}；
    业务规则与角色权限在 Service 层实现。
  version: 0.2.0
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: identity
    description: 身份与登录
  - name: site
    description: 巡检范围（区段/点位）
  - name: task
    description: 巡检任务
  - name: observation
    description: 现场记录与图片
  - name: review
    description: 审核
paths:
  /healthz:
    get:
      tags: [system]
      summary: 存活检查
      security: []
      responses:
        '200':
          description: ok
  /readyz:
    get:
      tags: [system]
      summary: 就绪检查（依赖 MySQL）
      security: []
      responses:
        '200':
          description: ready
        '503':
          description: not ready（database.required=false 降级启动）

  # ---------- 身份 ----------
  /api/v1/auth/login:
    post:
      tags: [identity]
      summary: PC 账号密码登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: admin }
                password: { type: string, example: Admin123 }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token: { type: string }
                      user: { $ref: '#/components/schemas/User' }
                      roles:
                        type: array
                        items: { type: string, enum: [INSPECTOR, ADMIN, REVIEWER] }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 用户被禁用
  /api/v1/auth/wechat-login:
    post:
      tags: [identity]
      summary: 小程序微信 code 换取已绑定人员会话
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: 'uni.login 返回的临时 code，服务端配置凭据并查询绑定账号' }
      responses:
        '200':
          description: 登录成功，响应结构同 /auth/login
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/me:
    get:
      tags: [identity]
      summary: 当前用户与角色
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user: { $ref: '#/components/schemas/User' }
                      roles:
                        type: array
                        items: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------- 巡检范围 ----------
  /api/v1/inspection-points:
    get:
      tags: [site]
      summary: 点位列表（巡检端只读）
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/InspectionPoint' }
    post:
      tags: [site]
      summary: 创建点位（管理员）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [segment_id, code, name, latitude, longitude]
              properties:
                segment_id: { type: integer }
                code: { type: string, example: P-EAST-03 }
                name: { type: string }
                latitude: { type: number, format: double }
                longitude: { type: number, format: double }
                radius_m: { type: number, default: 50 }
                location_hint: { type: string }
      responses:
        '201':
          description: 创建成功
        '403':
          description: 仅管理员
  /api/v1/wall-segments:
    post:
      tags: [site]
      summary: 创建城墙区段档案（管理员）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SegmentInput' }
      responses:
        '201': { description: data.segment 返回新档案 }
    get:
      tags: [site]
      summary: 区段列表
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/WallSegment' }

  /api/v1/wall-segments/{id}:
    put:
      tags: [site]
      summary: 更新区段档案及启用状态（管理员）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SegmentInput' }
      responses:
        '200': { description: data.segment 返回更新后档案 }
  /api/v1/inspection-points/{id}:
    put:
      tags: [site]
      summary: 更新巡检点位及启用状态（管理员）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/InspectionPoint' }
              required: [segment_id, code, name]
      responses:
        '200': { description: data.point 返回更新后点位 }
  /api/v1/observations/{id}/images/{image_id}:
    delete:
      tags: [observation]
      summary: 从草稿或退回记录移除图片关联（本人或管理员、审核员）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: image_id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: data.removed 为 true }
        '409': { $ref: '#/components/responses/Conflict' }
  # ---------- 任务 ----------
  /api/v1/tasks/assignees:
    get:
      tags: [task]
      summary: 有效巡检员选项（管理员或审核员）
      responses:
        '200':
          description: 仅包含启用且拥有 INSPECTOR 角色的人员，不返回登录凭据或微信标识
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            display_name: { type: string }
        '403':
          description: 无权查询人员选项
  /api/v1/tasks:
    post:
      tags: [task]
      summary: 创建任务草稿（管理员）
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, assignee_id, point_ids]
              properties:
                title: { type: string, example: '东城墙 2 号段巡检' }
                assignee_id: { type: integer, example: 3 }
                due_at: { type: string, format: date-time, example: '2026-10-15T00:00:00Z' }
                description: { type: string }
                point_ids: { type: array, items: { type: integer }, example: [1, 2] }
      responses:
        '201':
          description: 草稿创建成功（status=DRAFT, revision=1）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      task: { $ref: '#/components/schemas/Task' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [task]
      summary: 任务列表（按权限过滤，支持状态过滤与分页）
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [DRAFT, ASSIGNED, IN_PROGRESS, PENDING_REVIEW, COMPLETED, CANCELLED] } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      tasks:
                        type: array
                        items: { $ref: '#/components/schemas/Task' }
                      total: { type: integer, description: 满足过滤条件的总数（供前端分页） }
                      page: { type: integer }
                      page_size: { type: integer }
  /api/v1/tasks/{id}:
    get:
      tags: [task]
      summary: 任务详情与任务点
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      task: { $ref: '#/components/schemas/Task' }
                      points:
                        type: array
                        items: { $ref: '#/components/schemas/TaskPoint' }
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/tasks/{id}/dispatch:
    post:
      tags: [task]
      summary: 派发任务（管理员）：DRAFT → ASSIGNED，写点位快照
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision: { type: integer, example: 1 }
      responses:
        '200':
          description: 派发成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      task: { $ref: '#/components/schemas/Task' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/tasks/{id}/submit:
    post:
      tags: [task]
      summary: 提交整任务（负责人）：ASSIGNED/IN_PROGRESS → PENDING_REVIEW
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision: { type: integer, example: 2 }
      responses:
        '200':
          description: 提交成功
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/tasks/{id}/complete:
    post:
      tags: [task]
      summary: 完成任务（审核员/管理员）：PENDING_REVIEW → COMPLETED
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision: { type: integer, example: 3 }
                final_note: { type: string }
      responses:
        '200':
          description: 完成成功
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/tasks/{id}/cancel:
    post:
      tags: [task]
      summary: 取消任务（管理员；DRAFT/ASSIGNED/IN_PROGRESS → CANCELLED，已取消幂等返回现状）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, reason]
              properties:
                revision: { type: integer, example: 1 }
                reason: { type: string, example: '需求变更' }
      responses:
        '200':
          description: 取消成功（或已取消幂等返回）
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  # ---------- 现场记录 ----------
  /api/v1/observations:
    get:
      tags: [observation]
      summary: 记录列表（管理员/审核员全部，巡检员自己的上报；状态过滤 + 分页）
      parameters:
        - { name: task_id, in: query, required: false, schema: { type: integer, minimum: 1 } }
        - { name: task_point_id, in: query, required: false, schema: { type: integer, minimum: 1 } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [DRAFT, SUBMITTED, RETURNED, ACCEPTED, REJECTED] } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Observation' }
                      total: { type: integer }
                      page: { type: integer }
                      page_size: { type: integer }
    post:
      tags: [observation]
      summary: 创建现场记录草稿
      description: |
        source=TASK 必须携带 task_point_id（同一任务点逻辑唯一）；
        source=VOLUNTARY 不得携带 task_point_id，且必须提供位置描述。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, location_text]
              properties:
                source: { type: string, enum: [TASK, VOLUNTARY] }
                task_point_id: { type: integer, example: 1 }
                location_text: { type: string, example: '瓮城外墙东北角' }
      responses:
        '201':
          description: 草稿创建成功（status=DRAFT, revision=1）
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/observations/{id}:
    get:
      tags: [observation]
      summary: 记录证据（本人或管理员、审核员），包含识别尝试、候选、结论修订和审核记录
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: data.evidence 包含 observation、attempts、detections、conclusions、items、reviews
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [observation]
      summary: 更新草稿位置/现场判断（DRAFT/RETURNED）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision: { type: integer }
                location_text: { type: string }
                latitude: { type: number, format: double }
                longitude: { type: number, format: double }
                accuracy_m: { type: number }
                captured_at: { type: string, format: date-time }
                inspection_outcome: { type: string, enum: [NORMAL, SUSPECTED, UNDETERMINED, UNREACHABLE] }
      responses:
        '200':
          description: 更新成功
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/observations/{id}/images:
    get:
      tags: [observation]
      summary: 记录图片列表（负责人本人或管理员/审核员）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: 图片元数据（含受控访问 URL，不含存储路径）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      images:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            role: { type: string, enum: [OVERVIEW, DETAIL] }
                            media_type: { type: string }
                            byte_size: { type: integer }
                            width: { type: integer }
                            height: { type: integer }
                            url:
                              type: string
                              description: 受控图片内容接口路径（GET /api/v1/images/{id}/content）
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [observation]
      summary: 上传现场图片（multipart/form-data；支持 Idempotency-Key 幂等重放）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: Idempotency-Key, in: header, required: false, description: 同键重放返回首次结果，不产生重复图片, schema: { type: string } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary }
                image_role: { type: string, enum: [OVERVIEW, DETAIL], default: OVERVIEW }
      responses:
        '201':
          description: 图片登记成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      image: { $ref: '#/components/schemas/Image' }
        '400':
          description: 缺文件或类型不支持
  /api/v1/observations/{id}/conclusion:
    put:
      tags: [observation]
      summary: 保存人工结论（整体替换当前草稿结论版本）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, outcome]
              properties:
                revision: { type: integer }
                outcome: { type: string, enum: [NORMAL, SUSPECTED, UNDETERMINED, UNREACHABLE] }
                description: { type: string }
                priority_code: { type: string }
                items:
                  type: array
                  items:
                    type: object
                    required: [image_id, decision]
                    properties:
                      image_id: { type: integer }
                      source_detection_id: { type: integer }
                      decision: { type: string, enum: [CONFIRM, MODIFY, REJECT, ADD] }
                      final_class_code: { type: string }
                      final_box_json: { type: string }
                      description: { type: string }
      responses:
        '201':
          description: 结论版本已创建
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      conclusion: { $ref: '#/components/schemas/ConclusionRevision' }
        '400':
          description: 引用了非本记录图片
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/observations/{id}/submit:
    post:
      tags: [observation]
      summary: 提交记录：DRAFT/RETURNED → SUBMITTED（生成提交快照）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision: { type: integer }
      responses:
        '200':
          description: 提交成功（首次采集触发任务 ASSIGNED→IN_PROGRESS）
        '400':
          description: 缺概览图/人工结论/位置
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/observations/{id}/review:
    post:
      tags: [review]
      summary: 审核记录（审核员/管理员）
      description: |
        ACCEPT → ACCEPTED；RETURN（须理由）→ RETURNED；REJECT（仅 VOLUNTARY）→ REJECTED。
        不得审核本人提交的记录。
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, decision]
              properties:
                revision: { type: integer }
                decision: { type: string, enum: [ACCEPT, RETURN, REJECT] }
                reason: { type: string }
                disposition: { type: string }
      responses:
        '200':
          description: 审核完成
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  # ---------- 图片内容与识别 ----------
  /api/v1/images/{id}/content:
    get:
      tags: [observation]
      summary: 受控图片流（鉴权后返回，禁止公开 /uploads）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: 图片二进制流
          content:
            image/*: {}
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/images/{id}/preview:
    get:
      tags: [observation]
      summary: 受控照片预览（应用 EXIF 方向，与识别坐标系一致）
      description: 原始文件仍由 content 接口提供；预览保留完整像素尺寸且不含 EXIF 元数据。
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: 方向标准化的 JPEG 或 PNG
          content:
            image/jpeg: {}
            image/png: {}
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/images/{id}/recognitions:
    post:
      tags: [observation]
      summary: 触发一次识别尝试（每次重试新建 attempt，不覆盖历史）
      description: 仅草稿或退回补正中的记录可发起识别。并发请求各自获得独立尝试编号。
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                request_id: { type: string, description: 请求追踪 ID }
      responses:
        '200':
          description: 识别完成（成功或失败均返回 attempt 记录）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      attempt: { $ref: '#/components/schemas/RecognitionAttempt' }
                      detections:
                        type: array
                        items: { $ref: '#/components/schemas/Detection' }
        '409':
          description: 记录已提交或审核，不允许发起识别
        '500':
          description: 数据存储或内部服务异常
  /api/v1/reviews:
    get:
      tags: [review]
      summary: 待审核记录列表（审核员/管理员）
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Observation' }
  /api/v1/audit/events:
    get:
      tags: [audit]
      summary: 审计事件分页查询（仅管理员）
      parameters:
        - { name: entity_type, in: query, schema: { type: string }, description: 实体类型 task/observation }
        - { name: entity_id, in: query, schema: { type: integer, format: int64 } }
        - { name: actor_id, in: query, schema: { type: integer, format: int64 } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      events:
                        type: array
                        items: { $ref: '#/components/schemas/AuditEvent' }
                      total: { type: integer, format: int64 }
                      page: { type: integer }
                      page_size: { type: integer }
        '403':
          description: 非管理员无权限（code=FORBIDDEN）
        '503':
          description: 数据库未就绪（code=DB_UNAVAILABLE）

  # ===== 问题模块（004 迁移）=====
  /api/v1/issues:
    get:
      tags: [issue]
      summary: 问题台账（按状态/优先级/负责人/时间检索）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: priority_code, in: query, schema: { type: string } }
        - { name: assignee_id, in: query, schema: { type: integer, format: int64 } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Issue' }
                      total: { type: integer, format: int64 }
  /api/v1/issues/{id}:
    get:
      tags: [issue]
      summary: 问题详情（含关联现场记录与处置动作）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      issue: { $ref: '#/components/schemas/Issue' }
                      observations:
                        type: array
                        items: { $ref: '#/components/schemas/Observation' }
                      actions:
                        type: array
                        items: { $ref: '#/components/schemas/IssueAction' }
        '404':
          description: 问题不存在（code=NOT_FOUND）
  /api/v1/issues/{id}/assign:
    post:
      tags: [issue]
      summary: 指派问题（管理员/审核员，Idempotency-Key 幂等）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                revision: { type: integer, format: int64 }
                assignee_id: { type: integer, format: int64 }
                reason: { type: string }
      responses:
        '200': { description: ok }
        '409': { description: revision 冲突（code=CONFLICT） }
  /api/v1/issues/{id}/actions:
    post:
      tags: [issue]
      summary: 提交处理进展/观察安排（责任人，Idempotency-Key 幂等）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                revision: { type: integer, format: int64 }
                action_type: { type: string, enum: [PROGRESS, OBSERVE] }
                content: { type: string }
                planned_follow_up_at: { type: [string, 'null'] }
      responses:
        '200': { description: ok }
        '409': { description: revision 冲突（code=CONFLICT） }
  /api/v1/issues/{id}/request-verification:
    post:
      tags: [issue]
      summary: 申请核验（责任人，Idempotency-Key 幂等）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                revision: { type: integer, format: int64 }
                content: { type: string }
      responses:
        '200': { description: ok }
        '409': { description: revision 冲突（code=CONFLICT） }
  /api/v1/issues/{id}/verify:
    post:
      tags: [issue]
      summary: 核验问题（审核员/管理员，不能核验自己，Idempotency-Key 幂等）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                revision: { type: integer, format: int64 }
                decision: { type: string, enum: [PASS, RETURN] }
                reason: { type: string }
      responses:
        '200': { description: ok }
        '409': { description: revision 冲突（code=CONFLICT） }
  /api/v1/issues/{id}/reopen:
    post:
      tags: [issue]
      summary: 重开问题（管理员，Idempotency-Key 幂等）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                revision: { type: integer, format: int64 }
                reason: { type: string }
      responses:
        '200': { description: ok }
        '409': { description: revision 冲突（code=CONFLICT） }
  /api/v1/observations/{id}/admit:
    post:
      tags: [issue]
      summary: 现场记录受理（新建问题/关联已有问题/无问题说明，管理员/审核员，幂等）
      description: 在记录锁内保存受理结果。已受理的记录重复请求返回既有结果，不重复建问题或改写不立项原因。不立项说明不能与立项或关联混用。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                new_issues:
                  type: array
                  items:
                    type: object
                    properties:
                      title: { type: string }
                      priority_code: { type: string }
                      description: { type: string }
                link_issue_ids:
                  type: array
                  items: { type: integer, format: int64 }
                no_issue_reason: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      admit:
                        type: object
                        properties:
                          created_issue_ids: { type: array, items: { type: integer, format: int64 } }
                          linked_issue_ids: { type: array, items: { type: integer, format: int64 } }
                          no_issue_reason: { type: string }
                          already_admitted: { type: boolean }

  # ===== 报告模块（004 迁移）=====
  /api/v1/reports:
    get:
      tags: [report]
      summary: 报告台账（管理员/审核员）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: scope_type, in: query, schema: { type: string, enum: [TASK, DATE_RANGE] } }
        - { name: task_id, in: query, schema: { type: integer, format: int64 } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Report' }
                      total: { type: integer, format: int64 }
        '403': { description: 非审核权限（code=FORBIDDEN） }
  /api/v1/reports/task/{task_id}:
    post:
      tags: [report]
      summary: 生成任务报告（数据快照，生成失败可重试且不回滚任务状态）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: task_id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      report: { $ref: '#/components/schemas/Report' }
  /api/v1/reports/range:
    post:
      tags: [report]
      summary: 生成时间范围报告（起止时间 RFC3339）
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [start, end]
              properties:
                start: { type: string, format: date-time }
                end: { type: string, format: date-time }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      report: { $ref: '#/components/schemas/Report' }
  /api/v1/reports/{id}:
    get:
      tags: [report]
      summary: 报告详情（含快照元信息）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: ok }
        '404': { description: 报告不存在（code=NOT_FOUND） }
  /api/v1/reports/{id}/retry:
    post:
      tags: [report]
      summary: 重试失败报告（仅 FAILED 可重试）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: ok }
        '409': { description: 非 FAILED 状态（code=CONFLICT） }
  /api/v1/reports/{id}/file:
    get:
      tags: [report]
      summary: 下载报告 PDF（鉴权读取，客户端不可直连存储目录）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: application/pdf
          content:
            application/pdf:
              schema: { type: string, format: binary }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: 参数校验失败
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string, example: VALIDATION_ERROR }
                  message: { type: string }
              request_id: { type: string }
    Unauthorized:
      description: 未认证或凭证无效
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string, example: UNAUTHORIZED }
                  message: { type: string }
              request_id: { type: string }
    Forbidden:
      description: 无权限
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string, example: FORBIDDEN }
                  message: { type: string }
              request_id: { type: string }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string, example: NOT_FOUND }
                  message: { type: string }
              request_id: { type: string }
    Conflict:
      description: 状态/版本冲突
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string, example: CONFLICT }
                  message: { type: string }
              request_id: { type: string }
  schemas:
    SegmentInput:
      type: object
      required: [code, name]
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 128 }
        description: { type: string }
        active: { type: boolean }
    User:
      type: object
      properties:
        id: { type: integer }
        username: { type: [string, 'null'] }
        wechat_openid: { type: [string, 'null'] }
        display_name: { type: string }
        status: { type: string, enum: [ACTIVE, DISABLED] }
    WallSegment:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        description: { type: string }
        active: { type: boolean }
    InspectionPoint:
      type: object
      properties:
        id: { type: integer }
        segment_id: { type: integer }
        code: { type: string }
        name: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        radius_m: { type: number }
        location_hint: { type: string }
        active: { type: boolean }
    Task:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        assignee_id: { type: integer }
        due_at: { type: [string, 'null'], format: date-time }
        description: { type: [string, 'null'] }
        status:
          type: string
          enum: [DRAFT, ASSIGNED, IN_PROGRESS, PENDING_REVIEW, RETURNED, COMPLETED, CANCELLED]
        revision: { type: integer }
        dispatched_at: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
    TaskPoint:
      type: object
      properties:
        id: { type: integer }
        task_id: { type: integer }
        point_id: { type: integer }
        sequence_no: { type: integer }
        snapshot_name: { type: [string, 'null'] }
        snapshot_segment_id: { type: [integer, 'null'] }
        snapshot_latitude: { type: [number, 'null'] }
        snapshot_longitude: { type: [number, 'null'] }
        snapshot_radius_m: { type: [number, 'null'] }
        snapshot_location_hint: { type: [string, 'null'] }
    Observation:
      type: object
      properties:
        id: { type: integer }
        source: { type: string, enum: [TASK, VOLUNTARY] }
        task_point_id: { type: [integer, 'null'] }
        reporter_id: { type: integer }
        segment_id: { type: [integer, 'null'] }
        point_id: { type: [integer, 'null'] }
        location_text: { type: string }
        latitude: { type: [number, 'null'] }
        longitude: { type: [number, 'null'] }
        accuracy_m: { type: [number, 'null'] }
        distance_m: { type: [number, 'null'] }
        captured_at: { type: [string, 'null'], format: date-time }
        inspection_outcome: { type: [string, 'null'], enum: [NORMAL, SUSPECTED, UNDETERMINED, UNREACHABLE] }
        status: { type: string, enum: [DRAFT, SUBMITTED, RETURNED, ACCEPTED, REJECTED] }
        revision: { type: integer }
        submitted_at: { type: [string, 'null'], format: date-time }
        reviewed_at: { type: [string, 'null'], format: date-time }
        admitted_at: { type: [string, 'null'], format: date-time }
        admitted_by: { type: [integer, 'null'] }
        no_issue_reason: { type: string, description: 不立项时保存的人工说明 }
    Image:
      type: object
      properties:
        id: { type: integer }
        storage_key: { type: string, description: 服务端生成，不对外暴露目录 }
        sha256: { type: string }
        media_type: { type: string }
        byte_size: { type: integer }
        width: { type: integer }
        height: { type: integer }
        uploaded_by: { type: integer }
    RecognitionAttempt:
      type: object
      properties:
        id: { type: integer }
        image_id: { type: integer }
        attempt_no: { type: integer }
        analysis_json: { type: string, description: '结构化视觉分析 JSON 字符串，含 status、model、description、possible_causes、recommendations、error_code；未分析时为空' }
        status: { type: string, enum: [PENDING, SUCCEEDED, FAILED] }
        model_version: { type: [string, 'null'] }
        schema_version: { type: [string, 'null'] }
        latency_ms: { type: [integer, 'null'] }
        error_code: { type: [string, 'null'] }
    Detection:
      type: object
      properties:
        id: { type: integer }
        attempt_id: { type: integer }
        detection_key: { type: string }
        class_code: { type: string }
        confidence: { type: number }
        x1: { type: integer }
        y1: { type: integer }
        x2: { type: integer }
        y2: { type: integer }
    ConclusionRevision:
      type: object
      properties:
        id: { type: integer }
        observation_id: { type: integer }
        revision_no: { type: integer }
        outcome: { type: string, enum: [NORMAL, SUSPECTED, UNDETERMINED, UNREACHABLE] }
        description: { type: string }
        priority_code: { type: [string, 'null'] }
        author_id: { type: integer }
    AuditEvent:
      type: object
      properties:
        id: { type: integer, format: int64 }
        entity_type: { type: string, example: task }
        entity_id: { type: integer, format: int64 }
        action: { type: string, example: dispatch }
        actor_id: { type: integer, format: int64 }
        old_status: { type: [string, 'null'] }
        new_status: { type: [string, 'null'] }
        revision: { type: [integer, 'null'] }
        reason: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
    Issue:
      type: object
      properties:
        id: { type: integer, format: int64 }
        issue_no: { type: string, example: IS-2026-0001 }
        title: { type: string }
        segment_id: { type: [integer, 'null'] }
        point_id: { type: [integer, 'null'] }
        location_text: { type: string }
        description: { type: string }
        priority_code: { type: string, enum: [URGENT, WATCH, NORMAL] }
        assignee_id: { type: [integer, 'null'] }
        status: { type: string, enum: [UNASSIGNED, ASSIGNED, IN_PROGRESS, PENDING_VERIFY, CLOSED] }
        revision: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    IssueAction:
      type: object
      properties:
        id: { type: integer, format: int64 }
        issue_id: { type: integer, format: int64 }
        actor_id: { type: integer, format: int64 }
        action_type: { type: string, enum: [ASSIGN, SUGGEST, PROGRESS, OBSERVE, VERIFY, REOPEN] }
        content: { type: string }
        planned_follow_up_at: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
    Report:
      type: object
      properties:
        id: { type: integer, format: int64 }
        scope_type: { type: string, enum: [TASK, DATE_RANGE] }
        task_id: { type: [integer, 'null'] }
        range_start: { type: [string, 'null'] }
        range_end: { type: [string, 'null'] }
        status: { type: string, enum: [GENERATING, READY, FAILED] }
        error_code: { type: string }
        generated_by: { type: integer, format: int64 }
        snapshot_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'] }
        download_url: { type: [string, 'null'] }
