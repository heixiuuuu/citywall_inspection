plugins {
    id 'com.android.application'
}

android {
    namespace 'com.citywall.inspector'
    buildFeatures { buildConfig true }
    compileSdk 35

    defaultConfig {
        applicationId "com.citywall.inspector"
        minSdk 24
        targetSdk 35
        versionCode 200
        versionName "0.2.0"
    }

    signingConfigs {
        release {
            if (project.hasProperty('CITYWALL_STORE_FILE')) {
                storeFile file(project.property('CITYWALL_STORE_FILE'))
                storePassword project.findProperty('CITYWALL_STORE_PASSWORD')
                keyAlias project.findProperty('CITYWALL_KEY_ALIAS')
                keyPassword project.findProperty('CITYWALL_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (project.hasProperty('CITYWALL_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    configurations.all {
        resolutionStrategy {
            force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
